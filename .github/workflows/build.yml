---
name: build
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: chino-dev
          load: true
          cache-from: type=gha,scope=chino-dev
          cache-to: type=gha,scope=chino-dev,mode=max

      - name: Cache the Zig runtime's downloads and build
        uses: actions/cache@v4
        with:
          path: .zig-build
          key: zig-runtime-${{ hashFiles('runtimes/zig/**') }}
          restore-keys: zig-runtime-

      # Resources/runtimes/zig is not committed; build it into the checkout.
      - name: Build the Zig runtime
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -e HOME=/tmp \
            -e WORK_DIR=/app/.zig-build \
            -u "$(id -u)" \
            --entrypoint=/app/runtimes/zig/build \
            chino-dev

      - name: chino build
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -e HOME=/tmp \
            -u "$(id -u)" \
            --entrypoint=build \
            chino-dev
